<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mein Sudoku</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Sudoku</h1>

  <div id="steuerung">
    <select id="schwierigkeit">
      <option value="leicht">Leicht</option>
      <option value="mittel">Mittel</option>
      <option value="schwer">Schwer</option>
    </select>
    <button id="neuButton">Neues Rätsel</button>
  </div>

  <label>
    <input type="checkbox" id="fehlerSchalter" checked> Fehler anzeigen
  </label>

  <div id="status">
    <span id="zeit">⏱ 00:00</span>
    <span id="fehler">Fehler: 0</span>
  </div>

  <div id="spielfeld" class="fehler-an"></div>
  <div id="zahlenleiste"></div>
  <p id="meldung"></p>

  <!-- Reihenfolge ist wichtig: erst die Rätsel, dann das Spiel -->
  <script src="raetsel.js"></script>
  <script src="script.js"></script>
</body>
</html>
